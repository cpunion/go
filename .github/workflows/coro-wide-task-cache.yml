name: Wide coroutine task frame comparison

on:
  push:
    branches:
      - coro/measure-wide-task-cache-20261123

permissions:
  contents: read

jobs:
  measure:
    name: Compare exact task frame cache on Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validate and measure
        run: bash .github/perf-wide-task-cache/measure.sh 63746d7012c5283e48e8aea85e3339be6e0a333d a15f8c746461b54b20e86239a496a4298d2fcb70
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coroutine-wide-task-cache
          path: ${{ runner.temp }}/wide-task-cache
          if-no-files-found: error
