name: Coroutine parked task scaling

on:
  push:
    branches:
      - coro/measure-park-scaling-20261123

permissions:
  contents: read

jobs:
  measure:
    name: Measure coroutine parked task contention on Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compare executor policies and profile mixed channel waiters
        run: bash .github/perf-coro-park-scaling/measure.sh 63746d7012c5283e48e8aea85e3339be6e0a333d a15f8c746461b54b20e86239a496a4298d2fcb70
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coroutine-park-scaling
          path: ${{ runner.temp }}/park-result
          if-no-files-found: error
