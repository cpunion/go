name: Coroutine spawn routing

on:
  push:
    branches:
      - coro/measure-spawn-routing-20261123

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Measure cold and warm dispatch on the exact SDK
        run: bash .github/perf-coro-spawn-routing/measure.sh 435e07371d700fc0d84a9090ee4ec5e73a360320
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coro-spawn-routing
          path: ${{ runner.temp }}/coro-spawn-routing/validation
          if-no-files-found: error
