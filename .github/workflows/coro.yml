name: Coroutine compiler

on:
  pull_request:
    branches:
      - coro/main
  push:
    branches:
      - coro/main
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Collect observational native Linux benchmarks after tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: coro-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  focused:
    name: Focused (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Build default toolchain
        working-directory: src
        run: ./make.bash

      - name: Test default compiler and runtime
        run: >-
          ./bin/go test -count=1 -timeout=20m
          cmd/compile/...
          cmd/cgo
          cmd/go/internal/work
          go/build
          internal/pkgbits
          internal/buildcfg
          runtime

      - name: Test default coroutine architecture probes
        working-directory: src/cmd/compile/testdata/corobench
        env:
          GO111MODULE: off
        run: ../../../../../bin/go test -count=1 -cover

      - name: Build coroutine experiment toolchain
        working-directory: src
        env:
          GOEXPERIMENT: coro
        run: ./make.bash

      - name: Test coroutine compiler and runtime
        env:
          GOEXPERIMENT: coro
        run: >-
          ./bin/go test -count=1 -timeout=20m
          cmd/compile/...
          cmd/cgo
          cmd/go/internal/work
          go/build
          internal/pkgbits
          internal/buildcfg
          runtime

      - name: Test host fairness without asynchronous preemption
        env:
          GOEXPERIMENT: coro
          GODEBUG: asyncpreemptoff=1
        run: >-
          ./bin/go test -count=100 runtime
          -run '^TestStacklessCoro(Queued)?YieldRunsOrdinaryGoroutine$'

      - name: Test push and pull comparison
        env:
          GOEXPERIMENT: coro
        run: |
          ./bin/go test -tags=coropullcompare -count=1 -cover \
            runtime -run '^TestStacklessCoro'
          ./bin/go test -race -tags=coropullcompare -count=1 \
            runtime -run '^TestStacklessCoroPushPull'

      - name: Test coroutine architecture probes
        working-directory: src/cmd/compile/testdata/corobench
        env:
          GO111MODULE: off
          GOEXPERIMENT: coro
        run: ./check.bash "$GITHUB_WORKSPACE" "$RUNNER_TEMP/corobench"

      - name: Test coroutine heap-link lock ranks
        env:
          GOEXPERIMENT: coro,staticlockranking
          GODEBUG: asyncpreemptoff=1
          GOGC: 1
        shell: bash
        run: |
          out="$RUNNER_TEMP/corobench/static-lockrank"
          mkdir -p "$out"
          ./bin/go test -c -o "$out/runtime.test" runtime
          ./bin/go version -m "$out/runtime.test" > "$out/version.txt"
          pattern='^TestStacklessCoro(WriteBarrierLockRanks|FrameCache|NetpollReadyAccounting|SchedulerSize|OperationSize|TaskSize|IOOriginImmediateChannel|TimerOwnerReuse|SelectStorageCache|SelectOperationReuse|OperationReuse|ChannelImmediateWaiterCleanup|ChannelOperationRootingModes|Native(PoolGrowthAndReuse|SchedulerDescriptorReuse|SchedulerRuntimeWork))$'
          for procs in 1 4; do
            GOMAXPROCS=$procs "$out/runtime.test" -test.v -test.run="$pattern" \
              -test.count=10 -test.timeout=10m > "$out/p$procs.log" 2>&1
            cat "$out/p$procs.log"
          done

      - name: Upload coroutine architecture probe audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corobench-${{ matrix.os }}
          path: ${{ runner.temp }}/corobench
          if-no-files-found: error

      - name: Test transparent cgo direct calls
        env:
          GOEXPERIMENT: coro
        run: |
          ./bin/go test -count=1 cmd/go -run '^TestScript/cgo_coro_direct_metadata$'
          ./bin/go test -count=1 internal/runtime/cgobench \
            -gcflags=internal/runtime/cgobench='-l -d=coro=4'

      - name: Test coroutine operation races
        env:
          GOEXPERIMENT: coro
        run: ./bin/go test -race -count=1 runtime -run '^TestStacklessCoro'

  native-full:
    name: Native all.bash (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Run native full test suite
        working-directory: src
        env:
          # Source-oracle compiler tests share the all.bash package deadline.
          GO_TEST_TIMEOUT_SCALE: '2'
        run: ./all.bash

  native-benchmarks:
    name: Native benchmark collection (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    needs:
      - focused
      - native-full
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap and exact upstream baseline
        shell: bash
        run: |
          echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"
          git config --local core.abbrev 10
          git fetch --no-tags https://go.googlesource.com/go \
            master:refs/remotes/upstream/master
          baseline=$(git merge-base HEAD upstream/master)
          git worktree add --detach "$RUNNER_TEMP/go-baseline" "$baseline"

      - name: Build exact upstream default toolchain
        shell: bash
        run: |
          cd "$RUNNER_TEMP/go-baseline/src"
          GOEXPERIMENT='' ./make.bash

      - name: Build coroutine experiment toolchain
        working-directory: src
        env:
          GOEXPERIMENT: coro
        run: ./make.bash

      - name: Collect frozen native binaries
        working-directory: src/cmd/compile/testdata/corobench
        env:
          UPSTREAM_REF: upstream/master
        shell: bash
        run: |
          ./collect.bash "$RUNNER_TEMP/go-baseline" "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/native-corobench"

      - name: Upload all raw measurements and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-corobench-linux
          path: ${{ runner.temp }}/native-corobench
          if-no-files-found: error
