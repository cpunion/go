name: Coroutine compiler

on:
  pull_request:
    branches:
      - coro/main
  push:
    branches:
      - coro/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coro-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  focused:
    name: Focused (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Build default toolchain
        working-directory: src
        run: ./make.bash

      - name: Test default compiler and runtime
        run: >-
          ./bin/go test -count=1
          cmd/compile/...
          cmd/cgo
          cmd/go/internal/work
          go/build
          internal/pkgbits
          internal/buildcfg
          runtime

      - name: Test default coroutine architecture probes
        working-directory: src/cmd/compile/testdata/corobench
        env:
          GO111MODULE: off
        run: ../../../../../bin/go test -count=1 -cover

      - name: Build coroutine experiment toolchain
        working-directory: src
        env:
          GOEXPERIMENT: coro
        run: ./make.bash

      - name: Test coroutine compiler and runtime
        env:
          GOEXPERIMENT: coro
        run: >-
          ./bin/go test -count=1
          cmd/compile/...
          cmd/cgo
          cmd/go/internal/work
          go/build
          internal/pkgbits
          internal/buildcfg
          runtime

      - name: Test coroutine architecture probes
        working-directory: src/cmd/compile/testdata/corobench
        env:
          GO111MODULE: off
          GOEXPERIMENT: coro
        run: ./check.bash "$GITHUB_WORKSPACE" "$RUNNER_TEMP/corobench"

      - name: Measure saturated frame fast path
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          parent_root="$RUNNER_TEMP/go-parent"
          result="$RUNNER_TEMP/corobench/fast-path"
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$parent_root"
          git -C "$parent_root" checkout --quiet --detach b9c9d0e7efd958025f98281202cba7b5be73db61
          (
            cd "$parent_root/src"
            GOEXPERIMENT=coro ./make.bash
          )
          (
            cd "$parent_root/src/cmd/compile/testdata/corobench"
            GO111MODULE=off GOEXPERIMENT=coro \
              "$parent_root/bin/go" test -c -o "$RUNNER_TEMP/parent.test" \
              -gcflags='-l -d=coro=4'
          )
          mkdir -p "$result"
          parent="$RUNNER_TEMP/parent.test"
          feature="$RUNNER_TEMP/corobench/coro.test"
          args=(-test.run='^$' -test.bench='^(BenchmarkYieldEntry|BenchmarkRecursiveYield64|BenchmarkRecursiveYield4096)$' -test.benchtime=1s -test.count=1 -test.cpu=1)
          for i in {1..5}; do
            GOMAXPROCS=1 "$parent" "${args[@]}" >/dev/null
            GOMAXPROCS=1 "$feature" "${args[@]}" >/dev/null
          done
          for i in {1..20}; do
            if (( i % 2 )); then
              GOMAXPROCS=1 "$parent" "${args[@]}" >> "$result/parent.txt"
              GOMAXPROCS=1 "$feature" "${args[@]}" >> "$result/feature.txt"
            else
              GOMAXPROCS=1 "$feature" "${args[@]}" >> "$result/feature.txt"
              GOMAXPROCS=1 "$parent" "${args[@]}" >> "$result/parent.txt"
            fi
          done
          (
            cd "$result"
            GOTOOLCHAIN=local "$GITHUB_WORKSPACE/bin/go" run \
              golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d \
              parent.txt feature.txt | tee benchstat.txt
          )

      - name: Upload coroutine architecture probe audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corobench-${{ matrix.os }}
          path: ${{ runner.temp }}/corobench
          if-no-files-found: error

      - name: Test transparent cgo direct calls
        env:
          GOEXPERIMENT: coro
        run: |
          ./bin/go test -count=1 cmd/go -run '^TestScript/cgo_coro_direct_metadata$'
          ./bin/go test -count=1 internal/runtime/cgobench \
            -gcflags=internal/runtime/cgobench='-l -d=coro=4'

      - name: Test coroutine operation races
        env:
          GOEXPERIMENT: coro
        run: ./bin/go test -race -count=1 runtime -run '^TestStacklessCoro'

  native-full:
    name: Native all.bash (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Run native full test suite
        working-directory: src
        run: ./all.bash
