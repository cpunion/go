name: Coroutine compiler

on:
  pull_request:
    branches:
      - dev.coro
  push:
    branches:
      - dev.coro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coro-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  focused:
    name: Focused (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Install LLVM coroutine tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Build default toolchain
        working-directory: src
        run: ./make.bash

      - name: Test default compiler
        run: ./bin/go test -count=1 cmd/compile/... internal/pkgbits internal/buildcfg

      - name: Build coroutine experiment toolchain
        working-directory: src
        env:
          GOEXPERIMENT: coro
        run: ./make.bash

      - name: Run executable LLVM coroutine example
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOEXPERIMENT: coro
        run: |
          find_tool() {
            for tool in "$@"; do
              if command -v "$tool" >/dev/null 2>&1; then
                command -v "$tool"
                return
              fi
            done
            return 1
          }
          LLVM_OPT="$(find_tool opt opt-20 opt-19 opt-18)"
          LLVM_CLANG="$(find_tool clang clang-20 clang-19 clang-18)"
          export LLVM_OPT LLVM_CLANG
          "$LLVM_OPT" --version
          ./bin/go test -count=1 -run '^TestBasicLLVM' -v cmd/compile/internal/coro

      - name: Run Go object and external-link coroutine example
        shell: bash
        env:
          GOEXPERIMENT: coro
        run: |
          find_tool() {
            for tool in "$@"; do
              if command -v "$tool" >/dev/null 2>&1; then
                command -v "$tool"
                return
              fi
            done
            return 1
          }
          LLVM_CLANG="$(find_tool clang clang-20 clang-19 clang-18)"
          export LLVM_CLANG
          "$LLVM_CLANG" --version
          ./bin/go test -count=1 -run '^TestBasicObjectLink$' -v cmd/compile/internal/coro

      - name: Test coroutine compiler
        env:
          GOEXPERIMENT: coro
        run: >-
          ./bin/go test -count=1
          cmd/compile/...
          internal/pkgbits
          internal/buildcfg

  native-full:
    name: Native all.bash (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Select bootstrap GOROOT
        shell: bash
        run: echo "GOROOT_BOOTSTRAP=$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Run native full test suite
        working-directory: src
        run: ./all.bash
