name: Coroutine logical goroutine source enumeration exact source
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-source-enumeration:
    name: Exact-source logical goroutine source enumeration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false
      - name: Restore exact source and validation inputs
        run: |
          python3 - <<'PYINPUT'
          import base64,hashlib,io,tarfile
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='709bc196b4142b89267d171141cce6dce03c0cf19540055fc837947cd0aeecf8'
          with tarfile.open(fileobj=io.BytesIO(data)) as t:t.extractall('.',filter='data')
          PYINPUT
          git worktree add --detach "$RUNNER_TEMP/fixed" b3e939281010ef03da878af41582f55ef7d1eb9d
          mkdir -p native-output
      - name: Build genuine exact-source SDK
        id: build
        run: |
          export GOROOT_BOOTSTRAP=$(go env GOROOT)
          cd "$RUNNER_TEMP/fixed/src"
          GOEXPERIMENT=coro GOMAXPROCS=4 GOFLAGS=-p=4 GOGC=100 ./make.bash > "$GITHUB_WORKSPACE/native-output/make.log" 2>&1
      - name: Freeze genuine SDK before tests
        id: freeze
        if: always()
        env:
          CORO_BUILD_OUTCOME: ${{ steps.build.conclusion }}
        run: python3 native-inputs/export.py "$RUNNER_TEMP/fixed" "$GITHUB_WORKSPACE/native-output/frozen/linux"
      - name: Architecture compiler runtime maps pprof trace and repeated profile-transition and nil-Goexit regressions
        run: python3 native-inputs/matrix.py "$RUNNER_TEMP/fixed" "$GITHUB_WORKSPACE/native-output/matrix"
      - name: Restore archived source and SDK and compile fresh semantic replay
        run: python3 native-inputs/replay.py "$GITHUB_WORKSPACE/native-output" "$RUNNER_TEMP/restored-sdk"
      - name: Export original run identity
        if: always()
        run: |
          python3 - <<'PYMETA'
          import json,os
          from pathlib import Path
          names=['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF','RUNNER_OS','RUNNER_ARCH']
          d=Path('native-output');d.mkdir(exist_ok=True)
          (d/'identity.json').write_text(json.dumps({n:os.environ.get(n) for n in names},indent=2)+'\n')
          PYMETA
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coro-source-enumeration-validation
          path: native-output
          retention-days: 7
