name: Coroutine manager activation

on:
  push:
    branches:
      - coro/measure-manager-activation-20261123
      - coro/measure-first-child-20261123

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compare the manager and native stack handoff
        run: |
          if [[ "$GITHUB_REF_NAME" == coro/measure-first-child-20261123 ]]; then
            set -- owner-startup measured-dispatch prepared-owner
          else
            set --
          fi
          bash .github/perf-coro-manager-activation/measure.sh 435e07371d700fc0d84a9090ee4ec5e73a360320 "$@"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coro-manager-activation
          path: ${{ runner.temp }}/coro-manager-activation/validation
          if-no-files-found: error
