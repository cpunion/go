name: Native coroutine replacement handoff

on:
  push:
    branches:
      - coro/measure-native-idle-20261123

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compare replacement handoff paths
        run: bash .github/perf-coro-native-idle/measure.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-replacement-handoff
          path: ${{ runner.temp }}/coro-native-idle/results
          if-no-files-found: error
