name: Coroutine native scheduler performance

on:
  push:
    branches:
      - coro/measure-native-scheduler-20261123

permissions:
  contents: read

jobs:
  measure:
    name: Validate coroutine scheduling on Linux amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test and measure exact baseline and candidate SDKs
        run: bash .github/perf-coro-native-scheduler/measure.sh 63746d7012c5283e48e8aea85e3339be6e0a333d 7520103ee44eb09238112306fb0d8fb8bdc0af51
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coroutine-native-scheduler
          path: ${{ runner.temp }}/native-scheduler
          if-no-files-found: error
