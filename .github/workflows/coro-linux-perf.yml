name: Coroutine Linux ordered unwind comparison

on:
  push:
    branches: [coro/measure-native-linux-d340-20261122]

permissions:
  contents: read

jobs:
  compare:
    name: Compare ordered coroutine unwinds (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 8
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Measure ordered unwinds and run regressions
        shell: bash
        run: bash .github/coro-linux-perf/measure-ordered.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coroutine-linux-ordered-unwind
          path: ${{ runner.temp }}/coro-linux-perf-evidence
          if-no-files-found: error
          retention-days: 7

  full:
    if: github.event.before == '0000000000000000000000000000000000000000'
    name: Native all.bash (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
      GO_TEST_TIMEOUT_SCALE: '5'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 8
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run full tests at the measured revision
        shell: bash
        run: |
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          ref=d340d47ae16f0ea71ba6231488862677e33d8b8c
          git merge-base --is-ancestor "$ref" HEAD
          git worktree add --detach "$RUNNER_TEMP/coro-sdk" "$ref"
          cd "$RUNNER_TEMP/coro-sdk/src"
          ./all.bash
