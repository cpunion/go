name: Native coroutine cold dispatch phases

on:
  push:
    branches:
      - coro/measure-native-cold-phases-20261123

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compare cold startup and collect native dispatch timings
        run: bash .github/perf-coro-cold-dispatch/measure.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-cold-dispatch
          path: ${{ runner.temp }}/coro-cold-dispatch/results
          if-no-files-found: error
