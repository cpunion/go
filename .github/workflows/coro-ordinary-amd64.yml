name: Current bounded coroutine spawn dispatch on Linux amd64

on:
  push:
    branches:
      - coro/measure-wide-amd64-20261123

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Compare bounded spawn dispatch against official Go
        run: bash .github/perf-coro-ordinary-amd64/measure.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ordinary-spawn-amd64
          path: ${{ runner.temp }}/coro-ordinary-amd64/results
          if-no-files-found: error
